name: Deploy Watch Together

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-together-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download repository
        uses: actions/checkout@v4
      - name: Prepare Node on GitHub
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check required files
        run: |
          test -f wrangler.jsonc
          test -f worker.js
      - name: Install deployment tools on GitHub
        run: npm ci
      - name: Test relay locally on GitHub
        run: npm test
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: deploy
